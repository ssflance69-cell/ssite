<svg viewBox="0 0 800 620" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="hub-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#009FE3" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Water background hints -->
  <rect width="800" height="620" fill="#F8FAFC" rx="4"/>
  
  <!-- Subtle Grid Coordinates -->
  <line x1="60" y1="120" x2="740" y2="120" stroke="#E2E7F0" stroke-width="0.75" stroke-dasharray="2,4"/>
  <line x1="60" y1="260" x2="740" y2="260" stroke="#E2E7F0" stroke-width="0.75" stroke-dasharray="2,4"/>
  <line x1="60" y1="400" x2="740" y2="400" stroke="#E2E7F0" stroke-width="0.75" stroke-dasharray="2,4"/>
  <line x1="60" y1="540" x2="740" y2="540" stroke="#E2E7F0" stroke-width="0.75" stroke-dasharray="2,4"/>

  <line x1="160" y1="40" x2="160" y2="580" stroke="#E2E7F0" stroke-width="0.75" stroke-dasharray="2,4"/>
  <line x1="320" y1="40" x2="320" y2="580" stroke="#E2E7F0" stroke-width="0.75" stroke-dasharray="2,4"/>
  <line x1="480" y1="40" x2="480" y2="580" stroke="#E2E7F0" stroke-width="0.75" stroke-dasharray="2,4"/>
  <line x1="640" y1="40" x2="640" y2="580" stroke="#E2E7F0" stroke-width="0.75" stroke-dasharray="2,4"/>

  <text x="65" y="115" font-family="sans-serif" font-size="9" fill="#94A3B8">30° N</text>
  <text x="65" y="255" font-family="sans-serif" font-size="9" fill="#94A3B8">26° N</text>
  <text x="65" y="395" font-family="sans-serif" font-size="9" fill="#94A3B8">22° N</text>
  <text x="65" y="535" font-family="sans-serif" font-size="9" fill="#94A3B8">18° N</text>

  <text x="165" y="50" font-family="sans-serif" font-size="9" fill="#94A3B8">38° E</text>
  <text x="325" y="50" font-family="sans-serif" font-size="9" fill="#94A3B8">42° E</text>
  <text x="485" y="50" font-family="sans-serif" font-size="9" fill="#94A3B8">46° E</text>
  <text x="645" y="50" font-family="sans-serif" font-size="9" fill="#94A3B8">50° E</text>

  <!-- Water Labels -->
  <text x="100" y="440" font-family="sans-serif" font-size="11" font-weight="600" fill="#CBD5E1" letter-spacing="3" transform="rotate(-65 100 440)">RED SEA / البحر الأحمر</text>
  <text x="620" y="210" font-family="sans-serif" font-size="10" font-weight="600" fill="#CBD5E1" letter-spacing="2">ARABIAN GULF</text>

  <!-- Saudi Arabia Main Landmass Silhouette -->
  <path d="M 85,95 
           L 130,80 L 195,65 L 265,70 L 330,80 L 375,105 L 435,135 L 475,132 L 515,152 L 538,175
           L 535,200 L 545,215 L 568,235 L 575,260 L 595,270 L 610,290 L 635,300 L 680,320 
           L 745,345 L 760,375 L 745,415 L 715,450 L 655,490 L 565,525 L 475,540 L 405,548 
           L 345,562 L 310,575 L 295,570 L 280,545 L 268,485 L 245,445 L 225,395 L 205,355 
           L 175,305 L 155,255 L 135,195 L 115,150 L 95,115 Z"
        fill="#E8ECF5" stroke="#B8C4DC" stroke-width="1.75" stroke-linejoin="round"/>

  <!-- Regional Sub-boundaries (Engineering GIS lines) -->
  <path d="M 330,80 Q 380,220 440,320" fill="none" stroke="#D1D8E8" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M 440,320 L 568,235" fill="none" stroke="#009FE3" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.5"/>
  <path d="M 440,320 L 545,215" fill="none" stroke="#009FE3" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.5"/>
  <path d="M 440,320 L 225,395" fill="none" stroke="#009FE3" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.5"/>
  <path d="M 440,320 L 175,305" fill="none" stroke="#009FE3" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.5"/>
  <path d="M 440,320 L 125,135" fill="none" stroke="#009FE3" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.5"/>
  <path d="M 440,320 L 295,545" fill="none" stroke="#009FE3" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.5"/>

  <!-- Hub 1: RIYADH (National HQ) -->
  <g class="map-hub-pin active" data-hub="riyadh" transform="translate(440, 320)" style="cursor:pointer;">
    <circle r="16" fill="#009FE3" fill-opacity="0.2" class="pin-pulse"/>
    <circle r="7" fill="#14196B" stroke="#FFFFFF" stroke-width="2.5" class="pin-dot"/>
    <rect x="12" y="-12" width="105" height="24" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="20" y="4" font-family="sans-serif" font-size="11" font-weight="700" fill="#14196B">Riyadh (HQ)</text>
  </g>

  <!-- Hub 2: DAMMAM & KHOBAR -->
  <g class="map-hub-pin" data-hub="dammam" transform="translate(568, 235)" style="cursor:pointer;">
    <circle r="14" fill="#009FE3" fill-opacity="0.15" class="pin-pulse"/>
    <circle r="6" fill="#14196B" stroke="#FFFFFF" stroke-width="2" class="pin-dot"/>
    <rect x="12" y="-12" width="130" height="24" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="20" y="4" font-family="sans-serif" font-size="11" font-weight="600" fill="#14196B">Dammam &amp; Khobar</text>
  </g>

  <!-- Hub 3: JUBAIL INDUSTRIAL CITY -->
  <g class="map-hub-pin" data-hub="jubail" transform="translate(545, 205)" style="cursor:pointer;">
    <circle r="14" fill="#009FE3" fill-opacity="0.15" class="pin-pulse"/>
    <circle r="6" fill="#14196B" stroke="#FFFFFF" stroke-width="2" class="pin-dot"/>
    <rect x="-140" y="-12" width="130" height="24" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="-132" y="4" font-family="sans-serif" font-size="11" font-weight="600" fill="#14196B">Jubail Industrial</text>
  </g>

  <!-- Hub 4: JEDDAH & MAKKAH -->
  <g class="map-hub-pin" data-hub="jeddah" transform="translate(225, 395)" style="cursor:pointer;">
    <circle r="14" fill="#009FE3" fill-opacity="0.15" class="pin-pulse"/>
    <circle r="6" fill="#14196B" stroke="#FFFFFF" stroke-width="2" class="pin-dot"/>
    <rect x="-120" y="-12" width="110" height="24" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="-112" y="4" font-family="sans-serif" font-size="11" font-weight="600" fill="#14196B">Jeddah Hub</text>
  </g>

  <!-- Hub 5: YANBU INDUSTRIAL CITY -->
  <g class="map-hub-pin" data-hub="yanbu" transform="translate(175, 305)" style="cursor:pointer;">
    <circle r="14" fill="#009FE3" fill-opacity="0.15" class="pin-pulse"/>
    <circle r="6" fill="#14196B" stroke="#FFFFFF" stroke-width="2" class="pin-dot"/>
    <rect x="-115" y="-12" width="105" height="24" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="-107" y="4" font-family="sans-serif" font-size="11" font-weight="600" fill="#14196B">Yanbu Industrial</text>
  </g>

  <!-- Hub 6: NEOM & TABUK -->
  <g class="map-hub-pin" data-hub="neom" transform="translate(125, 135)" style="cursor:pointer;">
    <circle r="14" fill="#009FE3" fill-opacity="0.15" class="pin-pulse"/>
    <circle r="6" fill="#14196B" stroke="#FFFFFF" stroke-width="2" class="pin-dot"/>
    <rect x="12" y="-12" width="115" height="24" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="20" y="4" font-family="sans-serif" font-size="11" font-weight="600" fill="#14196B">NEOM &amp; Tabuk</text>
  </g>

  <!-- Hub 7: JAZAN -->
  <g class="map-hub-pin" data-hub="jazan" transform="translate(295, 545)" style="cursor:pointer;">
    <circle r="14" fill="#009FE3" fill-opacity="0.15" class="pin-pulse"/>
    <circle r="6" fill="#14196B" stroke="#FFFFFF" stroke-width="2" class="pin-dot"/>
    <rect x="12" y="-12" width="85" height="24" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <text x="20" y="4" font-family="sans-serif" font-size="11" font-weight="600" fill="#14196B">Jazan City</text>
  </g>
</svg>